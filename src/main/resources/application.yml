server:
  port: 8090

spring:
  # 로컬테스트용
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update  # 개발 중에는 update, 운영에서는 validate 또는 none 추천
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: my-super-secure-secret-key-1234567890

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: me.entvy.blog.entity

logging:
  level:
    org.springframework: INFO

# 파일 저장 경로 (로컬 저장 시 사용)
