server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/blog_db
    username: root
    password: 9785
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 개발 중에는 update, 운영에서는 validate 또는 none 추천
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework: INFO
    com.your.package: DEBUG  # 필요 시 패키지명 수정

